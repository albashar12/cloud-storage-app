<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudVault — Distributed Storage</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .dashboard-card { max-width: 750px; }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0284c7;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #0369a1; }
        .toggle-text { text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; }
        .toggle-text span { color: #38bdf8; cursor: pointer; text-decoration: underline; }
        .hidden { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logout-btn { width: auto; padding: 8px 16px; background: #ef4444; }
        .logout-btn:hover { background: #dc2626; }
        .upload-box {
            border: 2px dashed #38bdf8;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        .file-list { list-style: none; }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .file-info small { color: #94a3b8; display: block; margin-top: 3px; }
        .delete-btn { width: auto; padding: 6px 12px; background: #dc2626; font-size: 12px; }
        .msg { text-align: center; margin-bottom: 12px; font-size: 14px; color: #fbbf24; }
    </style>
</head>
<body>

    <!-- Auth Section -->
    <div id="auth-section" class="card">
        <h2 id="auth-title">Login</h2>
        <div id="auth-msg" class="msg"></div>
        <input type="text" id="name" placeholder="Full Name" class="hidden">
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button id="auth-btn" onclick="handleAuth()">Login</button>
        <p class="toggle-text">
            <span id="toggle-link" onclick="toggleMode()">Don't have an account? Sign Up</span>
        </p>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="card dashboard-card hidden">
        <div class="header">
            <div>
                <h2 style="text-align:left; margin:0;">CloudVault</h2>
                <small id="user-greeting" style="color:#94a3b8;"></small>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="upload-box">
            <input type="file" id="file-input" multiple style="border:none; background:transparent;">
            <button onclick="uploadFiles()">Upload Files</button>
        </div>

        <h3 style="margin-bottom: 12px;">Your Files</h3>
        <ul id="file-list" class="file-list"></ul>
    </div>

    <script>
        const API_URL = "http://localhost:5000/api";
        let isSignup = false;

        // পেজ লোড হলে চেক করবে ইউজার আগে থেকেই লগইন করা কিনা
        window.onload = () => {
            const token = localStorage.getItem("token");
            if (token) showDashboard();
        };

        function toggleMode() {
            isSignup = !isSignup;
            document.getElementById("auth-title").innerText = isSignup ? "Sign Up" : "Login";
            document.getElementById("auth-btn").innerText = isSignup ? "Sign Up" : "Login";
            document.getElementById("name").classList.toggle("hidden", !isSignup);
            document.getElementById("toggle-link").innerText = isSignup 
                ? "Already have an account? Login" 
                : "Don't have an account? Sign Up";
            document.getElementById("auth-msg").innerText = "";
        }

        async function handleAuth() {
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const msgEl = document.getElementById("auth-msg");

            const endpoint = isSignup ? "/auth/signup" : "/auth/login";
            const payload = isSignup ? { name, email, password } : { email, password };

            try {
                const res = await fetch(API_URL + endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (!data.success) {
                    msgEl.innerText = data.message || "Something went wrong!";
                    return;
                }

                if (isSignup) {
                    msgEl.innerText = "🎉 Signup successful! Now please login.";
                    toggleMode();
                } else {
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("userUuid", data.userUuid);
                    localStorage.setItem("userName", data.name);
                    showDashboard();
                }
            } catch (err) {
                msgEl.innerText = "Server connection failed!";
            }
        }

        function showDashboard() {
            document.getElementById("auth-section").classList.add("hidden");
            document.getElementById("dashboard-section").classList.remove("hidden");
            document.getElementById("user-greeting").innerText = "Welcome, " + localStorage.getItem("userName");
            fetchFiles();
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        async function uploadFiles() {
            const fileInput = document.getElementById("file-input");
            if (fileInput.files.length === 0) return alert("Please select files first!");

            const formData = new FormData();
            formData.append("userUuid", localStorage.getItem("userUuid"));
            for (const file of fileInput.files) {
                formData.append("files", file);
            }

            const res = await fetch(API_URL + "/file/upload", {
                method: "POST",
                body: formData
            });
            const data = await res.json();
            alert(data.message);
            fileInput.value = "";
            fetchFiles();
        }

        async function fetchFiles() {
            const userUuid = localStorage.getItem("userUuid");
            const res = await fetch(`${API_URL}/file/user-files/${userUuid}`);
            const data = await res.json();

            const list = document.getElementById("file-list");
            list.innerHTML = "";

            if (!data.files || data.files.length === 0) {
                list.innerHTML = "<p style='color:#94a3b8;'>No files uploaded yet.</p>";
                return;
            }

            data.files.forEach(file => {
                const sizeKB = (file.fileSize / 1024).toFixed(2);
                list.innerHTML += `
                    <li class="file-item">
                        <div class="file-info">
                            <strong>${file.originalName}</strong>
                            <small>${sizeKB} KB • Stored in: ${file.megaAccountEmail}</small>
                        </div>
                        <button class="delete-btn" onclick="deleteFile('${file._id}')">Delete</button>
                    </li>
                `;
            });
        }

        async function deleteFile(id) {
            if (!confirm("Are you sure you want to delete this file?")) return;
            const res = await fetch(`${API_URL}/file/file/${id}`, { method: "DELETE" });
            const data = await res.json();
            alert(data.message);
            fetchFiles();
        }
    </script>
</body>
</html>
